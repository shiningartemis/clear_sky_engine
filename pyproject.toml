[project]
name = "clear-sky-engine"
version = "0.1.0"
description = "Windows 本地 AI 角色扮演生活模拟游戏"
requires-python = "==3.14.6"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
  "live_ai: 使用真实 Provider 和模型的付费集成测试",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["backend/src", "backend/tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
